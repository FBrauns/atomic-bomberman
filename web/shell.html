<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Atomic Bomberman (modern) — web</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0f; color: #ddd; font: 15px/1.4 system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas#canvas { display: block; outline: none; image-rendering: pixelated; aspect-ratio: 4 / 3;
                  width: min(100vw, calc(100vh * 4 / 3)); height: auto; max-height: 100vh; background: #000; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px; align-items: center;
             justify-content: center; background: rgba(5,5,8,.92); cursor: pointer; text-align: center; padding: 24px; }
  #overlay h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: .02em; }
  #overlay .hint { opacity: .7; max-width: 520px; }
  #status { opacity: .85; min-height: 1.4em; }
  #overlay.ready #status::after { content: ''; }
  #overlay .go { display: none; gap: 12px; }
  #overlay.ready .go { display: flex; }
  #overlay .go button { padding: 10px 22px; border-radius: 8px; border: 0; background: #e8572a; color: #fff; font: 600 15px system-ui, sans-serif; cursor: pointer; }
  #overlay .go button#hostRoom { background: #2a6fe8; }
  #overlay.error { cursor: default; }
  #overlay.error #status { color: #ff8a80; }
  #room { position: fixed; left: 10px; bottom: 10px; display: none; gap: 8px; align-items: center; font-size: 13px;
          background: rgba(20,20,28,.88); border: 1px solid #333; border-radius: 10px; padding: 6px 10px; z-index: 5; }
  #room b { font-size: 17px; letter-spacing: .12em; color: #ffcf3f; font-family: ui-monospace, monospace; }
  #room button { background: #e8572a; color: #fff; border: 0; border-radius: 6px; padding: 5px 9px; font-size: 13px; font-weight: 600; cursor: pointer; }
  #room .peers { opacity: .7; font-size: 13px; }
  #room .x { background: transparent; color: #aaa; padding: 2px 6px; }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #5a1d1d; color: #fff;
           padding: 10px 16px; border-radius: 8px; display: none; z-index: 6; max-width: 90vw; }
  footer { position: fixed; right: 10px; bottom: 6px; pointer-events: auto; font-size: 11px; opacity: .45; }
  footer a { color: inherit; }
</style>
</head>
<body>
<div id="stage"><canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas></div>
<div id="overlay">
  <h1>Atomic Bomberman (modern)</h1>
  <div id="status">Loading…</div>
  <div class="go"><button id="play">Play</button> <button id="hostRoom">Create online room</button></div>
  <div class="hint">Unofficial fan project, not affiliated with Interplay, Hudson Soft or Konami. It contains no original game files: graphics and sounds are generated by the program.</div>
</div>
<div id="room"><span>Room</span><b id="roomCode"></b><button id="copyInvite">Copy invite link</button><span class="peers" id="peerCount"></span><button class="x" id="hideRoom" title="Hide">✕</button></div>
<div id="toast"></div>
<footer>GPL-3.0 · based on <a href="https://github.com/elraro/atomic-bomberman" target="_blank" rel="noopener">elraro/atomic-bomberman</a></footer>
<script>
  const overlay = document.getElementById('overlay');
  const statusEl = document.getElementById('status');
  const canvas = document.getElementById('canvas');
  let started = false;
  // The game starts on a click, so that the browser lets it play sound and has the keyboard.
  var Module = {
    canvas,
    noInitialRun: true,
    print: (t) => console.log(t),
    printErr: (t) => console.warn(t),
    setStatus: (t) => { if (!started) statusEl.textContent = t || 'Ready'; },
    onRuntimeInitialized: () => {
      overlay.classList.add('ready');
      statusEl.textContent = 'Ready';
    },
    abOnQuit: () => {
      overlay.classList.remove('ready');
      overlay.style.display = 'flex';
      statusEl.textContent = 'The game has ended. Reload the page to play again.';
    },
    onAbort: (what) => {
      overlay.style.display = 'flex';
      overlay.classList.add('error');
      statusEl.textContent = 'Error: ' + what + ' (see the browser console)';
    },
  };
  // Network play (web/net.js): the room code of a hosted game, and invitations by link.
  const params = new URLSearchParams(location.search);
  // ?signal=host:port[/path] uses another PeerJS signalling server (for testing); default: the public one.
  const signal = params.get('signal');
  if (signal) {
    const m = signal.match(/^([^:/]+)(?::(\d+))?(\/.*)?$/);
    if (m) Module.abPeerOptions = { host: m[1], port: m[2] ? +m[2] : 443, path: m[3] || '/', secure: m[1] !== 'localhost' && m[1] !== '127.0.0.1' };
  }
  const joinCode = (params.get('join') || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
  const roomBox = document.getElementById('room');
  const toast = document.getElementById('toast');
  let toastTimer = 0;
  const showToast = (text, ms = 6000) => {
    toast.textContent = text; toast.style.display = 'block';
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.style.display = 'none', ms);
  };
  Module.abShowRoom = (code) => {
    document.getElementById('roomCode').textContent = code;
    roomBox.style.display = 'flex';
    const url = location.origin + location.pathname + '?join=' + code;
    document.getElementById('copyInvite').onclick = async () => {
      try { await navigator.clipboard.writeText(url); showToast('Invite link copied: ' + url, 4000); }
      catch (e) { prompt('Invite link:', url); }
      canvas.focus();
    };
  };
  Module.abShowPeers = (n) => { document.getElementById('peerCount').textContent = n ? n + (n === 1 ? ' player connected' : ' players connected') : ''; };
  Module.abShowNetError = (text) => showToast(text);
  document.getElementById('hideRoom').onclick = () => { roomBox.style.display = 'none'; canvas.focus(); };
  if (joinCode) {
    document.getElementById('play').textContent = 'Join room ' + joinCode;
    document.getElementById('hostRoom').style.display = 'none';
  }
  // Play: the menu (or straight into the invited room); Create online room: host at once.
  const start = (args) => {
    if (started || !overlay.classList.contains('ready')) return;
    started = true;
    overlay.style.display = 'none';
    canvas.focus();
    Module.callMain(args);
  };
  document.getElementById('hostRoom').addEventListener('click', (e) => { e.stopPropagation(); start(['--host']); });
  overlay.addEventListener('click', () => start(joinCode ? ['--connect', joinCode] : []));
  window.addEventListener('keydown', (e) => {
    if (!started && overlay.classList.contains('ready') && (e.key === 'Enter' || e.key === ' ')) overlay.click();
    // Keep the arrow keys and the space bar in the game instead of scrolling the page.
    if (started && ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Tab','Backspace'].includes(e.key)) e.preventDefault();
  });
</script>
<script src="peerjs.min.js"></script>
{{{ SCRIPT }}}
</body>
</html>
