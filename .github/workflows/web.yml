name: web

# Builds the game for the browser (Emscripten: WebAssembly + WebGL 2) and publishes it
# on GitHub Pages. The page plays with the free asset set the program makes itself; no
# original game files are built in or served.
# Pages must be set to "GitHub Actions" once: Settings > Pages > Build and deployment > Source.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.1
          actions-cache-folder: emsdk-cache

      - name: Configure
        run: emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release -DAB_ONLINE=OFF -DAB_FETCH_SDL3=ON

      - name: Build
        run: cmake --build build-web --target atomic -j4

      - name: Collect the page
        run: |
          mkdir -p site
          cp build-web/index.html build-web/index.js build-web/index.wasm build-web/peerjs.min.js build-web/peerjs.LICENSE site/
          touch site/.nojekyll
          ls -la site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
